description: Let $k$ be a field of characteristic $2$, and $\lambda\in k$ be a (nonzero)
  element that isn't a root of unity. Let $S=k\langle x, x^{-1}, y, y^{-1}\rangle/\langle
  xy-\lambda yx\rangle$, and $h$ the automorphism of $S$ with $h(x)=x^{-1}$, $h(y)=y^{-1}$.
  $R=S*\langle h\rangle$ is the skew group ring.
